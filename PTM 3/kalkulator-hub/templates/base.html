<!doctype html>
<html lang='id'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Kalkulator Hub: alat hitung sederhana untuk operator, cicilan, BMI, dan suhu.'>
    <title>{% block title %}Kalkulator Hub{% endblock %}</title>
    <link rel='stylesheet' href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<body>
    <header class='site-header'>
        <div class='header-inner'>
            <a class='brand' href='{{ url_for("home") }}'>
                <span class='brand-icon' aria-hidden='true'>∑</span>
                <span>Kalkulator<span class='brand-accent'>Hub</span></span>
            </a>
            <nav class='main-nav' aria-label='Navigasi utama'>
                <a href='{{ url_for("kalkulator") }}'>Kalkulator</a>
                <a href='{{ url_for("cicilan") }}'>Cicilan</a>
                <a href='{{ url_for("bmi") }}'>BMI</a>
                <a href='{{ url_for("suhu") }}'>Konversi suhu</a>
            </nav>
        </div>
    </header>

    <main class='page-shell'>
        {% block content %}{% endblock %}
    </main>

    <footer class='site-footer'>
        <div class='footer-inner'>
            <span>Kalkulator Hub</span>
            <span>Belajar menghitung, satu langkah setiap kali.</span>
        </div>
    </footer>
</body>
</html>
